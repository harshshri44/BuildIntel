# ==============================================================================
# BuildIntel - MahaRERA Real-Estate Intelligence Platform
# Docker Compose Orchestration Specification
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: buildintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-buildintel_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Exposes database for local database clients (DBeaver, pgAdmin)
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-buildintel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buildintel-network

  # ----------------------------------------------------------------------------
  # 2. Spring Boot REST Backend + Python Scraper Subprocess Runtime
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: buildintel-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-buildintel_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200,http://127.0.0.1:4200}
      PYTHON_EXECUTABLE: /app/venv/bin/python
      SCRAPER_SCRIPT_PATH: /app/Scrapper/scraper.py
      EXPORT_SCRIPT_PATH: /app/Scrapper/export_excel.py
      EXPORTS_DIR: /app/exports
      PYTHONUNBUFFERED: "1"
    volumes:
      - exports_data:/app/exports
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/dashboard/stats || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - buildintel-network

  # ----------------------------------------------------------------------------
  # 3. Angular Single Page Application + Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: buildintel-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - buildintel-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: buildintel-postgres-data
  exports_data:
    name: buildintel-exports-data

# ------------------------------------------------------------------------------
# Internal Container Network
# ------------------------------------------------------------------------------
networks:
  buildintel-network:
    name: buildintel-network
    driver: bridge

